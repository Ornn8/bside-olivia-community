name: finalize-pr105-review-blockers

on:
  push:
    branches:
      - feat/p03-memory-default-runtime

permissions:
  contents: write

concurrency:
  group: finalize-pr105-review-blockers
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out current feature head
        uses: actions/checkout@v4
        with:
          ref: feat/p03-memory-default-runtime
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize and correct final product source
        run: |
          python tools/prepare_memory_default_runtime.py
          python tools/finalize_pr105_review_blockers.py

      - name: Verify one-shot implementation machinery is absent
        shell: pwsh
        run: |
          $forbidden = @(
            '.github/workflows/build-memory-default-runtime.yml',
            '.github/workflows/probe-memory-model.yml',
            '.github/workflows/finalize-pr105.yml',
            'tools/prepare_memory_default_runtime.py',
            'tools/finalize_memory_default_runtime.py',
            'tools/finalize_pr105_review_blockers.py',
            'installed_memory_runtime.py'
          )
          foreach ($path in $forbidden) {
            if (Test-Path -LiteralPath $path) {
              throw "one-shot path remains: $path"
            }
          }
          foreach ($path in @(
            'installer/Install.ps1',
            'installer/start_local.py',
            'mem0_memory.py',
            'memory_model.py',
            'tools/provision_memory_model.py',
            '.github/workflows/memory-runtime-smoke.yml',
            'tests/installer/test_memory_storage_separation.py'
          )) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "final product path missing: $path"
            }
          }

      - name: Install public test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run complete public suite on final tree
        run: python -m pytest -q

      - name: Run repository hardening scan
        run: python baseline_hardening_scan.py --mode all

      - name: Install pinned memory runtime from final tree
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r installer/memory-runtime-requirements.txt

      - name: Provision pinned Chinese model from final tree
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'olivia-memory-model-cache'
          python tools/provision_memory_model.py --manifest installer/memory-model-manifest.json --cache-root $cache --provision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OLIVIA_TEST_MODEL_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OLIVIA_MEMORY_RUNTIME_TEST=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HF_HUB_OFFLINE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HF_HUB_DISABLE_TELEMETRY=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DO_NOT_TRACK=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run real offline model and Mem0/Qdrant test
        shell: pwsh
        run: |
          python -m pytest -q -rs tests/memory/test_mem0_installed_runtime.py 2>&1 | Tee-Object -FilePath real-memory-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -LiteralPath real-memory-test.log -Pattern 'skipped') {
            throw 'real memory runtime test was skipped'
          }

      - name: Run path separation regression
        run: python -m pytest -q tests/installer/test_memory_storage_separation.py

      - name: Stage and verify exact final diff
        shell: pwsh
        run: |
          git add -A
          git diff --cached --check
          $changed = git diff --cached --name-only
          if ($changed -match 'prepare_memory_default_runtime|finalize_pr105|build-memory-default-runtime|probe-memory-model|installed_memory_runtime') {
            throw "temporary implementation path remains in final diff: $changed"
          }

      - name: Commit only if this run still owns the branch head
        shell: bash
        run: |
          git fetch origin feat/p03-memory-default-runtime
          remote_head=$(git rev-parse origin/feat/p03-memory-default-runtime)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Branch advanced to $remote_head; a newer finalizer run owns it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No final source changes to commit."
            exit 0
          fi
          git commit -m "feat(memory): commit normal offline Mem0 runtime"
          git push origin HEAD:feat/p03-memory-default-runtime
