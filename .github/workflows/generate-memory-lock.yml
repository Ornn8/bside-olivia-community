name: generate-memory-runtime-lock

on:
  push:
    branches:
      - feat/p03-memory-default-runtime
    paths:
      - .github/workflows/generate-memory-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/p03-memory-default-runtime
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve exact binary dependency closure
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          source = Path("installer/runtime-requirements.txt").read_text(encoding="utf-8")
          constraints = []
          for raw in source.splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              constraints.append(line.split(" --hash=", 1)[0])
          Path("core-constraints.txt").write_text("\n".join(constraints) + "\n", encoding="utf-8")
          '@ | python -
          python -m pip install --disable-pip-version-check --dry-run --ignore-installed --only-binary=:all: --report memory-report.json -c core-constraints.txt "mem0ai==2.0.18" "fastembed==0.8.0"

      - name: Write hash-locked requirements
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path

          report = json.loads(Path("memory-report.json").read_text(encoding="utf-8"))
          rows = []
          for item in report.get("install", []):
              metadata = item.get("metadata") or {}
              name = str(metadata.get("name", "")).strip()
              version = str(metadata.get("version", "")).strip()
              archive = (item.get("download_info") or {}).get("archive_info") or {}
              hashes = archive.get("hashes") or {}
              digest = hashes.get("sha256")
              if not name or not version or not isinstance(digest, str) or len(digest) != 64:
                  raise SystemExit(f"unlocked distribution in pip report: {name}=={version}")
              normalized = name.replace("_", "-")
              rows.append((normalized.casefold(), f"{normalized}=={version} --hash=sha256:{digest}"))
          if not rows:
              raise SystemExit("empty memory runtime dependency report")
          lines = [
              "# Fixed CPython 3.12 Windows closure for Mem0 OSS + FastEmbed.",
              "# Generated with pip --only-binary=:all: and constrained to the core runtime pins.",
              *(line for _key, line in sorted(rows)),
              "",
          ]
          Path("installer/memory-runtime-requirements.txt").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )
          '@ | python -

      - name: Commit generated lock
        shell: bash
        run: |
          rm -f .github/workflows/generate-memory-lock.yml core-constraints.txt memory-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(memory): lock managed runtime dependencies"
          git push origin HEAD:feat/p03-memory-default-runtime
