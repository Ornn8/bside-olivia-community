name: apply-runtime-upgrade-fix

on:
  push:
    branches:
      - feat/p03-memory-default-runtime

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/p03-memory-default-runtime
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source changes
        run: python tools/apply_runtime_upgrade_fix.py

      - name: Remove one-shot machinery
        shell: pwsh
        run: |
          Remove-Item -LiteralPath 'tools/apply_runtime_upgrade_fix.py' -Force
          Remove-Item -LiteralPath '.github/workflows/apply-runtime-upgrade-fix.yml' -Force

      - name: Install public test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused upgrade tests
        run: python -m pytest -q tests/installer/test_full_patch_runtime_upgrade.py tests/test_installer.py tests/installer/test_memory_default_runtime.py

      - name: Run full public suite
        run: python -m pytest -q

      - name: Run hardening scan
        run: python baseline_hardening_scan.py --mode all

      - name: Check final tree
        shell: bash
        run: |
          git diff --check
          test ! -e tools/apply_runtime_upgrade_fix.py
          test ! -e .github/workflows/apply-runtime-upgrade-fix.yml

      - name: Commit final reviewed fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(installer): upgrade controlled runtime payloads"
          git push origin HEAD:feat/p03-memory-default-runtime
