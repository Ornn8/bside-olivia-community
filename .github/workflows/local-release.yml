name: local-release

on:
  push:
    branches:
      - main
    paths:
      - client/installer/release-version.json
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: client

jobs:
  local-release:
    name: Build and publish local patch
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Validate release metadata
        id: metadata
        shell: pwsh
        run: |
          $version = (Get-Content installer/release-version.json -Raw | ConvertFrom-Json).version
          $project = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$'
          if (-not $project -or $project.Matches[0].Groups[1].Value -ne $version) {
            throw "release-version.json and pyproject.toml do not match"
          }
          if (-not (Test-Path "docs/releases/v$version.md")) {
            throw "missing docs/releases/v$version.md"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $previous = git show 'HEAD^:client/installer/release-version.json' 2>$null
          if ($LASTEXITCODE -ne 0) {
            $previous = git show 'HEAD^:installer/release-version.json' 2>$null
          }
          $changed = $true
          if ($LASTEXITCODE -eq 0 -and $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
            $changed = (($previous | ConvertFrom-Json).version -ne $version)
          }
          "changed=$($changed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Build update bundle
        if: steps.metadata.outputs.changed == 'true'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "olivia-local-release"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $wheelDir = Join-Path $env:RUNNER_TEMP "olivia-image-wheel"
          python -m pip download --only-binary=:all: --no-deps --platform win_amd64 --python-version 312 --implementation cp --abi cp312 --dest $wheelDir "Pillow==12.3.0"
          if ($LASTEXITCODE -ne 0) { throw "image dependency download failed" }
          python -m installer build-update `
            --source "$PWD" `
            --output "$output\Olivia-$env:VERSION.oliviapatch" `
            --version "$env:VERSION" `
            --source-commit "$env:GITHUB_SHA" `
            --image-dependency-wheel "$wheelDir\pillow-12.3.0-cp312-cp312-win_amd64.whl"
          if ($LASTEXITCODE -ne 0) { throw "update build failed" }
          "RELEASE_DIR=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build checksum manifest
        if: steps.metadata.outputs.changed == 'true'
        shell: pwsh
        run: |
          $lines = Get-ChildItem $env:RELEASE_DIR -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content (Join-Path $env:RELEASE_DIR "SHA256SUMS.txt") -Encoding utf8NoBOM

      - name: Upload release artifact
        if: steps.metadata.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Olivia-local-release
          path: ${{ runner.temp }}/olivia-local-release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.metadata.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $notes = "docs/releases/v$env:VERSION.md"
          $assets = Get-ChildItem $env:RELEASE_DIR -File | ForEach-Object { $_.FullName }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Olivia $env:VERSION" `
              --notes-file $notes
          }
