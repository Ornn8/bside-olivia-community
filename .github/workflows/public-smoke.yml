name: public-smoke

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  public-smoke:
    name: Public smoke (Windows / Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded PrivateWorld direct-management slice
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/original-private-world-direct-management')
        run: python tools/prepare_original_private_world_direct_management.py

      - name: Stage prepared source for scanners
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/original-private-world-direct-management')
        run: git add -A

      - name: Install public development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run public smoke tests
        run: python -m pytest -q

      - name: Run repository hardening scan
        run: python baseline_hardening_scan.py --mode all

      - name: Check prepared whitespace
        run: git diff --cached --check

      - name: Commit prepared PrivateWorld direct management
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/original-private-world-direct-management')
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(private-world): expose direct original-client commands"
          git push origin HEAD:${TARGET_BRANCH}
