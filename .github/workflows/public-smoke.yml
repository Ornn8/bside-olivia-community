name: public-smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: memory-runtime-finalize
  cancel-in-progress: true

jobs:
  public-smoke:
    name: Public smoke (Windows / Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: feat/p03-memory-default-runtime
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize final product sources
        run: |
          python tools/prepare_memory_default_runtime.py
          python tools/finalize_memory_default_runtime.py

      - name: Keep workflow files unchanged for the GitHub App push
        shell: pwsh
        run: |
          git checkout origin/feat/p03-memory-default-runtime -- .github/workflows
          git add -A

      - name: Verify non-workflow one-shot machinery is gone
        shell: pwsh
        run: |
          $forbidden = @(
            'tools/prepare_memory_default_runtime.py',
            'tools/finalize_memory_default_runtime.py',
            'installed_memory_runtime.py',
            'tests/memory/test_installed_memory_runtime.py',
            'tests/memory/test_memory_prompt_installed_runtime.py'
          )
          foreach ($path in $forbidden) {
            if (Test-Path -LiteralPath $path) {
              throw "one-shot path remains: $path"
            }
          }

      - name: Install public test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run public suite against final tree
        run: python -m pytest -q

      - name: Run repository hardening scan
        run: python baseline_hardening_scan.py --mode all

      - name: Check final whitespace
        run: git diff --cached --check

      - name: Commit final tested non-workflow source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(memory): commit offline Mem0 runtime sources"
          git push origin HEAD:feat/p03-memory-default-runtime
