name: public-smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: memory-runtime-finalize
  cancel-in-progress: true

jobs:
  public-smoke:
    name: Public smoke (Windows / Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: feat/p03-memory-default-runtime
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize final product sources
        run: |
          python tools/prepare_memory_default_runtime.py
          python tools/finalize_memory_default_runtime.py

      - name: Stage final product tree
        shell: pwsh
        run: |
          git add -A
          $workflowDiff = git diff --cached --name-only -- '.github/workflows'
          if ($workflowDiff) {
            throw "workflow mutation remains in product commit: $workflowDiff"
          }

      - name: Verify one-shot machinery is gone
        shell: pwsh
        run: |
          $forbidden = @(
            '.github/workflows/build-memory-default-runtime.yml',
            '.github/workflows/probe-memory-model.yml',
            'tools/prepare_memory_default_runtime.py',
            'tools/finalize_memory_default_runtime.py',
            'installed_memory_runtime.py',
            'tests/memory/test_installed_memory_runtime.py',
            'tests/memory/test_memory_prompt_installed_runtime.py'
          )
          foreach ($path in $forbidden) {
            if (Test-Path -LiteralPath $path) {
              throw "one-shot path remains: $path"
            }
          }
          if (-not (Test-Path -LiteralPath '.github/workflows/memory-runtime-smoke.yml')) {
            throw 'final memory-runtime-smoke workflow is missing'
          }

      - name: Install public test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run public suite against final tree
        run: python -m pytest -q

      - name: Run repository hardening scan
        run: python baseline_hardening_scan.py --mode all

      - name: Check final whitespace
        run: git diff --cached --check

      - name: Commit final tested source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(memory): enable committed offline Mem0 runtime"
          git push origin HEAD:feat/p03-memory-default-runtime
