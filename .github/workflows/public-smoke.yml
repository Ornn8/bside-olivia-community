name: public-smoke

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  public-smoke:
    name: Public smoke (Windows / Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded memory runtime source
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/p03-memory-default-runtime'
        run: python tools/prepare_memory_default_runtime.py

      - name: Remove temporary implementation machinery
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/p03-memory-default-runtime'
        shell: pwsh
        run: |
          git checkout origin/main -- memory_prompt.py
          git checkout origin/main -- .github/workflows/public-smoke.yml
          git rm --ignore-unmatch installed_memory_runtime.py
          git rm --ignore-unmatch .github/workflows/probe-memory-model.yml
          git rm --ignore-unmatch .github/workflows/build-memory-default-runtime.yml
          git rm --ignore-unmatch tools/prepare_memory_default_runtime.py
          git rm --ignore-unmatch tests/memory/test_installed_memory_runtime.py
          git rm --ignore-unmatch tests/memory/test_memory_prompt_installed_runtime.py
          git add -A

      - name: Install public development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run public smoke tests
        run: python -m pytest -q

      - name: Run repository hardening scan
        run: python baseline_hardening_scan.py --mode all

      - name: Check whitespace
        shell: bash
        run: |
          if git diff --cached --quiet; then
            git diff --check --exit-code
          else
            git diff --cached --check
          fi

      - name: Commit final tested source
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/p03-memory-default-runtime'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(memory): enable default installed Mem0 runtime"
          git push origin HEAD:feat/p03-memory-default-runtime
