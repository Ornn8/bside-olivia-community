name: public-smoke

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  public-smoke:
    name: Public smoke (Windows / Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded settings clickability fix
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/fix/original-settings-clickability')
        run: python tools/prepare_original_settings_clickability_fix.py

      - name: Install public development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run public smoke tests
        run: python -m pytest -q

      - name: Run repository hardening scan
        run: python baseline_hardening_scan.py --mode all

      - name: Check whitespace
        run: git diff --check --exit-code

      - name: Commit prepared clickability fix
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/fix/original-settings-clickability')
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(client): make original settings dialog interactive"
          git push origin HEAD:${TARGET_BRANCH}
