name: public-smoke

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: client

jobs:
  public-smoke:
    name: Public smoke (Windows / Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public development dependencies
        run: python -m pip install -e ".[dev]"

      # The settings-page browser tests drive the installed Chrome / Edge; without Playwright they are skipped
      # (that is how a broken QQ settings page reached 2.5.7). The bundled Chromium covers the tests that start it.
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install chromium

      - name: Run public smoke tests
        run: python -m pytest -q

      - name: Run repository hardening scan
        run: python baseline_hardening_scan.py --mode all

      - name: Check repository-wide secret and artifact boundaries
        run: python baseline_hardening_scan.py --root .. --mode secrets --mode sensitive-paths --mode large-files --mode evidence-ignore

      - name: Check whitespace
        run: git diff --check --exit-code
