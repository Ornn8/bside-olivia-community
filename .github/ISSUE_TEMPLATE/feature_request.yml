name: Feature request
description: Propose a change that fits the public repository boundary
title: "[feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        公开仓库只接受不依赖官方资源、私有模型、真实凭据或不可审计网络状态的方案。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明接口、失败状态、fixture 和回滚方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: boundary
    attributes:
      label: 边界确认
      options:
        - label: 不需要提交官方资源、模型权重、真实凭据或用户数据
          required: true
        - label: 可以在 provider/官方资源缺失时保持明确的 UNAVAILABLE 或 DEGRADED
          required: true
