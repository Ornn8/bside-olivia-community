[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bside-olivia-local"
version = "0.1.0.dev0"
description = "Local HTTP and media-state prototype for BSide Olivia Lin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9,<4",
    "imageio-ffmpeg>=0.6,<1",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.26,<5",
    "pytest>=8,<9",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
]
memory-mem0 = [
    "mem0ai==2.0.18",
    "sentence-transformers>=5.2,<6",
]

[tool.setuptools]
py-modules = [
    "baseline_hardening_scan",
    "bounded_daemon_call",
    "companion_memory_context",
    "conversation_memory_admin",
    "conversation_memory_delivery",
    "conversation_memory_outbox",
    "conversation_memory_port",
    "conversation_memory_runtime",
    "extract_player",
    "http_contract",
    "letter_triage",
    "llm_gateway",
    "letter_status",
    "local_memory",
    "local_server",
    "latentsync_reply",
    "mem0_memory",
    "memory",
    "memory_port",
    "memory_prompt",
    "music_caption",
    "music_duration",
    "music_reply",
    "original_client_companion_api",
    "original_client_companion_backend",
    "original_client_companion_mutation_api",
    "original_client_companion_mutation_backend",
    "original_client_letter_contract",
    "original_client_media_http",
    "original_client_server",
    "original_client_settings_ui",
    "patch_companion_settings",
    "patch_feapp",
    "persona_loader",
    "persona_assembly",
    "prompt_budget",
    "persona_provider",
    "private_world_port",
    "private_world_candidates",
    "private_world_commands",
    "private_world_service",
    "private_world_reducer",
    "private_world_ledger",
    "private_world_admin",
    "private_world_candidate",
    "private_world_delivery",
    "private_world_projection",
    "private_world_runtime",
    "reply_context",
    "reply_delivery",
    "reply_media",
    "reply_orchestrator",
    "reply_policy",
    "reply_model_quality",
    "reply_pipeline",
    "reply_quality_gate",
    "reply_reviewer",
    "song_content",
    "voice_direction",
]

[tool.setuptools.packages.find]
include = [
    "asr*",
    "contracts*",
    "control_center*",
    "installer*",
    "linli_character*",
    "media_state*",
    "runtime*",
    "tts*",
]

[tool.setuptools.package-data]
contracts = ["*.json"]
control_center = ["static/*.html", "static/*.css", "static/*.js"]
linli_character = [
    "persona_release_v2.json",
    "persona_release_provenance_v2.json",
]
