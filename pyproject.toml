[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bside-olivia-local"
version = "0.1.0.dev0"
description = "Local HTTP and media-state prototype for BSide Olivia Lin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9,<4",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.26,<5",
    "pytest>=8,<9",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
]
memory-mem0 = [
    "mem0ai==2.0.18",
    "sentence-transformers>=5.2,<6",
]

[tool.setuptools]
py-modules = [
    "baseline_hardening_scan",
    "companion_memory_context",
    "conversation_memory_delivery",
    "conversation_memory_port",
    "extract_player",
    "http_contract",
    "letter_status",
    "local_server",
    "mem0_memory",
    "memory",
    "patch_feapp",
    "persona_loader",
    "persona_assembly",
    "prompt_budget",
    "private_world_port",
    "private_world_candidates",
    "private_world_commands",
    "private_world_service",
    "private_world_reducer",
    "private_world_ledger",
    "private_world_admin",
    "private_world_delivery",
    "private_world_projection",
    "reply_context",
    "reply_policy",
    "reply_model_quality",
    "reply_pipeline",
    "reply_quality_gate",
    "reply_reviewer",
]

[tool.setuptools.packages.find]
include = [
    "asr*",
    "contracts*",
    "control_center*",
    "installer*",
    "linli_character*",
    "media_state*",
    "runtime*",
    "tts*",
]

[tool.setuptools.package-data]
control_center = ["static/*.html", "static/*.css", "static/*.js"]
