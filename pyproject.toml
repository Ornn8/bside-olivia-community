[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bside-olivia-local"
version = "0.1.0.dev0"
description = "Local HTTP and media-state prototype for BSide Olivia Lin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9,<4",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.26,<5",
    "pytest>=8,<9",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
]

[tool.setuptools]
py-modules = [
    "baseline_hardening_scan",
    "extract_player",
    "http_contract",
    "local_server",
    "memory",
    "patch_feapp",
    "persona_loader",
    "persona_assembly",
    "prompt_budget",
    "private_world_port",
    "private_world_candidates",
    "private_world_commands",
    "private_world_service",
    "private_world_reducer",
    "private_world_ledger",
    "private_world_admin",
    "private_world_delivery",
    "private_world_projection",
    "reply_context",
    "reply_policy",
    "reply_model_quality",
    "reply_pipeline",
    "reply_quality_gate",
    "reply_reviewer",
]

[tool.setuptools.packages.find]
include = [
    "asr*",
    "contracts*",
    "control_center*",
    "installer*",
    "linli_character*",
    "media_state*",
    "runtime*",
    "tts*",
]

[tool.setuptools.package-data]
control_center = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = [
    "tests/persona",
    "tests/private_world",
    "tests/control_center",
    "tests/http",
    "tests/installer",
    "tests/media",
    "tests/test_asset_manifest.py",
    "tests/test_third_party_download.py",
    "tests/test_baseline_hardening.py",
    "tests/test_visual_baseline.py",
    "tests/test_visual_compare.py",
]
addopts = ["--basetemp=.evidence", "-m", "not experimental"]
markers = [
    "experimental: excluded from the public baseline gate; run explicitly by path",
]
