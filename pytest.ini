[pytest]
testpaths =
    tests/http
    tests/media
    tests/persona
    tests/private_world
    tests/test_asset_manifest.py
    tests/test_third_party_download.py
    tests/test_baseline_hardening.py
    tests/test_visual_baseline.py
    tests/test_visual_compare.py
addopts = --basetemp=.evidence/pytest --import-mode=importlib -m "not experimental"
markers =
    experimental: excluded from the public baseline gate; run explicitly by path
